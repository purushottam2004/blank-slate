name: Android unit tests, lint, and debug APK

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  check:
    name: Test, lint, assemble debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "Preinstalled sdkmanager not found at $sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses || true
          "$sdkmanager" --sdk_root="$sdk_root" \
            "platforms;android-37.2" "build-tools;36.0.0"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        working-directory: android
        run: ./gradlew test lint assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: android/apps/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
