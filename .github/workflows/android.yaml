name: Android unit tests, lint, and debug APK

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'android/**'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  check:
    name: Test, lint, assemble debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -O /tmp/commandlinetools.zip
          unzip -q /tmp/commandlinetools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" \
            "platform-tools" "platforms;android-37.2" "build-tools;36.0.0"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug APK
        working-directory: android
        run: ./gradlew test lint assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: android/apps/mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
