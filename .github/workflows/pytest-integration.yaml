name: Integration Tests (pytest)

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'backend/**'
      - 'supabase/**'
  pull_request:
    paths:
      - 'backend/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            supabase/uv.lock

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        working-directory: supabase
        run: |
          supabase start

      - name: Get Supabase credentials
        id: supabase
        working-directory: supabase
        run: |
          echo "url=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "publishable_key=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY')" >> $GITHUB_OUTPUT
          echo "secret_key=$(supabase status --output json | jq -r '.SECRET_KEY')" >> $GITHUB_OUTPUT

      - name: Seed test data
        working-directory: supabase
        run: |
          uv sync --frozen --no-dev
          uv run python seed.py
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret_key }}

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Run integration tests
        working-directory: backend
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret_key }}
          GEMINI_API_KEY: mock-api-key
          DEPLOYMENT_ENV: LOCAL
        run: |
          uv run pytest tests/integration/ -v --tb=short

      - name: Stop Supabase
        if: always()
        working-directory: supabase
        run: |
          supabase stop
