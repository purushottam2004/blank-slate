name: React Native checks

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'react-native/**'
      - '.github/workflows/react-native.yaml'
  pull_request:
    paths:
      - 'react-native/**'
      - '.github/workflows/react-native.yaml'
  workflow_dispatch:

jobs:
  check:
    name: Lint, type-check, and unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: react-native/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test
