name: React Native debug APK

on:
  workflow_dispatch:

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: react-native/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Use the runner Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "Preinstalled sdkmanager not found at $sdkmanager"
            exit 1
          fi
          yes | "$sdkmanager" --sdk_root="$sdk_root" --licenses || true
          "$sdkmanager" --sdk_root="$sdk_root" \
            "platforms;android-37" \
            "platforms;android-37.2" \
            "build-tools;36.0.0" \
            "build-tools;37.0.0" \
            "ndk;27.1.12297006"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: react-native
        run: pnpm install --frozen-lockfile

      - name: Generate the Android project
        working-directory: react-native
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        working-directory: react-native/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: react-native-debug-apk
          path: react-native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
