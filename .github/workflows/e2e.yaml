name: E2E Tests (Playwright)

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - 'backend/**'
      - 'supabase/**'
  pull_request:
    paths:
      - 'e2e/**'
      - 'frontend/**'
      - 'backend/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: |
            backend/uv.lock
            supabase/uv.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start local Supabase
        working-directory: supabase
        run: supabase start

      - name: Get Supabase credentials
        id: supabase
        working-directory: supabase
        run: |
          echo "url=$(supabase status --output json | jq -r '.API_URL')" >> $GITHUB_OUTPUT
          echo "publishable_key=$(supabase status --output json | jq -r '.PUBLISHABLE_KEY')" >> $GITHUB_OUTPUT
          echo "secret_key=$(supabase status --output json | jq -r '.SECRET_KEY')" >> $GITHUB_OUTPUT

      - name: Seed test data
        working-directory: supabase
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret_key }}
        run: |
          uv sync --frozen --no-dev
          uv run python seed.py

      - name: Start backend
        working-directory: backend
        env:
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret_key }}
          DEPLOYMENT_ENV: LOCAL
        run: |
          uv sync --frozen --no-dev
          nohup uv run python main.py > /tmp/backend.log 2>&1 &
          timeout 60 bash -c 'until curl -sf http://127.0.0.1:8080/ >/dev/null; do sleep 1; done' || (echo "Backend failed to start. Logs:" && cat /tmp/backend.log && exit 1)

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}

      - name: Run E2E tests
        env:
          VITE_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          VITE_BACKEND_URL: http://127.0.0.1:8080
          API_URL: http://127.0.0.1:8080
          SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret_key }}
          CI: "true"
        working-directory: e2e
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Stop Supabase
        if: always()
        working-directory: supabase
        run: supabase stop
