# Dependabot version updates. Security updates use the same ecosystems.
# pnpm projects use package-ecosystem "npm". The frontend workspace lock is
# frontend/pnpm-lock.yaml, so the per-app lockfiles are not separate entries.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directories:
      - /backend
      - /supabase
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      uv-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directories:
      - /frontend
      - /react-native
      - /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
