[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.139.2",
    "litellm==1.92.0",
    "python-dotenv==1.2.2",
    "python-json-logger==4.1.0",
    "supabase==2.31.0",
    "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.16.9",
    "supabase-pydantic>=0.26.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
