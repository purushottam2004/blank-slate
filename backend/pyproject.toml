[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.164.0",
    "litellm==1.110.0",
    "python-dotenv==1.2.4",
    "python-json-logger==4.2.0",
    "supabase==2.34.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.17.5",
    "supabase-pydantic>=0.26.29",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
