repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^(backend|supabase)/
      - id: ruff-format
        files: ^(backend|supabase)/
  - repo: local
    hooks:
      - id: lint-staged
        name: lint-staged (frontend prettier)
        entry: bash -c 'cd frontend && ./node_modules/.bin/lint-staged'
        language: system
        pass_filenames: false
        files: ^frontend/
