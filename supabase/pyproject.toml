[project]
name = "template-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv==1.2.2",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
